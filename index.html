<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Análisis de Redes Sociales</title>
    <!-- Usamos Chart.js para los gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --surface2: #242836;
            --border: #2e3345;
            --text: #e5e7eb;
            --text2: #9ca3af;
            --primary: #3b82f6;
            --green: #22c55e;
            --red: #ef4444;
            --purple: #8b5cf6;
            --cyan: #06b6d4;
            --yellow: #eab308;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 24px;
        }
        .header {
            margin-bottom: 32px;
        }
        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
        }
        .header p {
            color: var(--text2);
            margin-top: 4px;
        }
        /* Barra de pestañas para simular las redes */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .tab {
            padding: 8px 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text2);
            transition: all 0.2s;
        }
        .tab:hover {
            background: var(--surface2);
        }
        .tab.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        /* Rejilla de KPIs */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }
        .kpi-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }
        .kpi-title {
            color: var(--text2);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        .kpi-value {
            font-size: 2rem;
            font-weight: 800;
        }
        .kpi-change {
            font-size: 0.9rem;
            margin-top: 4px;
            display: inline-block;
            padding: 2px 8px;
            border-radius: 20px;
        }
        .kpi-change.up {
            color: var(--green);
            background: rgba(34, 197, 94, 0.12);
        }
        .kpi-change.down {
            color: var(--red);
            background: rgba(239, 68, 68, 0.12);
        }
        /* Contenedor de gráficos */
        .charts-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        @media (max-width: 900px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }
        .chart-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }
        .chart-card h3 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text2);
        }
        .chart-container {
            position: relative;
            height: 300px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Panel de Análisis</h1>
        <p>Selecciona una red social para ver sus métricas simuladas.</p>
    </div>

    <!-- Pestañas de Redes Sociales -->
    <div class="tabs" id="tabs">
        <button class="tab active" data-network="instagram">Instagram</button>
        <button class="tab" data-network="youtube">YouTube</button>
        <button class="tab" data-network="tiktok">TikTok</button>
        <button class="tab" data-network="facebook">Facebook</button>
    </div>

    <!-- KPIs -->
    <div class="kpi-grid">
        <div class="kpi-card">
            <div class="kpi-title">Seguidores</div>
            <div class="kpi-value" id="kpi-followers">0</div>
            <span class="kpi-change up" id="kpi-followers-change">+0%</span>
        </div>
        <div class="kpi-card">
            <div class="kpi-title">Alcance</div>
            <div class="kpi-value" id="kpi-reach">0</div>
            <span class="kpi-change up" id="kpi-reach-change">+0%</span>
        </div>
        <div class="kpi-card">
            <div class="kpi-title">Impresiones</div>
            <div class="kpi-value" id="kpi-impressions">0</div>
            <span class="kpi-change up" id="kpi-impressions-change">+0%</span>
        </div>
        <div class="kpi-card">
            <div class="kpi-title">Interacciones</div>
            <div class="kpi-value" id="kpi-engagement">0</div>
            <span class="kpi-change down" id="kpi-engagement-change">-0%</span>
        </div>
    </div>

    <!-- Gráficos -->
    <div class="charts-grid">
        <div class="chart-card">
            <h3>Crecimiento (Últimos 7 días)</h3>
            <div class="chart-container">
                <canvas id="growthChart"></canvas>
            </div>
        </div>
        <div class="chart-card">
            <h3>Distribución de Tráfico</h3>
            <div class="chart-container">
                <canvas id="trafficChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // --- Datos Simulados para cada Red ---
        const mockData = {
            instagram: {
                followers: 12450,
                reach: 8900,
                impressions: 22000,
                engagement: 3450,
                growth: [120, 180, 150, 220, 280, 250, 310], // Seguidores nuevos
                traffic: [45, 25, 20, 10] // % Tráfico: Directo, Búsqueda, Social, Otros
            },
            youtube: {
                followers: 5800,
                reach: 15000,
                impressions: 45000,
                engagement: 1200,
                growth: [30, 45, 60, 40, 75, 90, 85], // Suscriptores nuevos
                traffic: [30, 40, 20, 10]
            },
            tiktok: {
                followers: 32000,
                reach: 120000,
                impressions: 250000,
                engagement: 18000,
                growth: [500, 650, 700, 800, 750, 900, 1100],
                traffic: [50, 15, 30, 5]
            },
            facebook: {
                followers: 8700,
                reach: 5600,
                impressions: 14000,
                engagement: 890,
                growth: [15, 10, 25, 30, 20, 35, 40],
                traffic: [35, 30, 25, 10]
            }
        };

        // --- Elementos del DOM ---
        const kpiFollowers = document.getElementById('kpi-followers');
        const kpiReach = document.getElementById('kpi-reach');
        const kpiImpressions = document.getElementById('kpi-impressions');
        const kpiEngagement = document.getElementById('kpi-engagement');
        const changes = {
            followers: document.getElementById('kpi-followers-change'),
            reach: document.getElementById('kpi-reach-change'),
            impressions: document.getElementById('kpi-impressions-change'),
            engagement: document.getElementById('kpi-engagement-change')
        };

        // --- Inicializar Gráficos ---
        let growthChartInstance = null;
        let trafficChartInstance = null;

        const growthCtx = document.getElementById('growthChart').getContext('2d');
        const trafficCtx = document.getElementById('trafficChart').getContext('2d');

        function formatNumber(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        function updateDashboard(network) {
            const data = mockData[network];
            if (!data) return;

            // Actualizar KPIs
            kpiFollowers.textContent = formatNumber(data.followers);
            kpiReach.textContent = formatNumber(data.reach);
            kpiImpressions.textContent = formatNumber(data.impressions);
            kpiEngagement.textContent = formatNumber(data.engagement);

            // Simular cambios porcentuales aleatorios para dar realismo
            const randomChange = () => (Math.random() * 20 - 5).toFixed(1) + '%';
            
            changes.followers.textContent = '+' + randomChange();
            changes.followers.className = 'kpi-change up';
            
            changes.reach.textContent = '+' + randomChange();
            changes.reach.className = 'kpi-change up';
            
            changes.impressions.textContent = '+' + randomChange();
            changes.impressions.className = 'kpi-change up';
            
            const engChange = randomChange();
            changes.engagement.textContent = (engChange.startsWith('-') ? '' : '+') + engChange;
            changes.engagement.className = engChange.startsWith('-') ? 'kpi-change down' : 'kpi-change up';

            // Destruir gráficos anteriores si existen para evitar superposición
            if (growthChartInstance) growthChartInstance.destroy();
            if (trafficChartInstance) trafficChartInstance.destroy();

            // Gráfico de Líneas (Crecimiento)
            growthChartInstance = new Chart(growthCtx, {
                type: 'line',
                data: {
                    labels: ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'],
                    datasets: [{
                        label: 'Nuevos Seguidores',
                        data: data.growth,
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        fill: true,
                        tension: 0.4,
                        pointBackgroundColor: '#3b82f6',
                        pointBorderColor: '#fff',
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            ticks: { color: '#9ca3af' }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#9ca3af' }
                        }
                    }
                }
            });

            // Gráfico de Dona (Tráfico)
            trafficChartInstance = new Chart(trafficCtx, {
                type: 'doughnut',
                data: {
                    labels: ['Directo', 'Búsqueda', 'Social', 'Otros'],
                    datasets: [{
                        data: data.traffic,
                        backgroundColor: [
                            '#3b82f6',
                            '#22c55e',
                            '#8b5cf6',
                            '#eab308'
                        ],
                        borderColor: '#1a1d27',
                        borderWidth: 3,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                color: '#9ca3af',
                                padding: 20,
                                usePointStyle: true,
                                pointStyle: 'circle'
                            }
                        }
                    },
                    cutout: '70%'
                }
            });
        }

        // --- Manejo de Eventos de Pestañas ---
        const tabs = document.querySelectorAll('.tab');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                // Remover clase activa de todos
                tabs.forEach(t => t.classList.remove('active'));
                // Añadir al clickeado
                tab.classList.add('active');
                // Actualizar dashboard
                updateDashboard(tab.dataset.network);
            });
        });

        // --- Inicialización ---
        // Cargar Instagram por defecto
        updateDashboard('instagram');

    </script>
</body>
</html>
